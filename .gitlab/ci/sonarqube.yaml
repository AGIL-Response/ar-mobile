image:
  name: sonarsource/sonar-scanner-cli:11
  entrypoint: ['']

build-sonar:
  stage: build-sonar
  needs:
    - job: unit_tests
      artifacts: true

  cache:
    policy: pull-push
    key: 'sonar-cache-$CI_COMMIT_REF_SLUG'
    paths:
      - '${SONAR_USER_HOME}/cache'
      - sonar-scanner/

  script:
    - VERSION=$(sed -nE 's/.*"version":[[:space:]]*"([^"]+)".*/\1/p' package.json)
    - sonar-scanner -Dsonar.host.url="${SONAR_HOST_URL}" -Dsonar.projectVersion="${VERSION}"
  allow_failure: true
  rules:
    - if: $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == "187-test-story-for-pipeline-test"
      when: never
    - if: $CI_COMMIT_BRANCH == 'develop'
    - if: $CI_COMMIT_BRANCH == 'main'
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

sonarqube-vulnerability-report:
  stage: security
  script:
    - 'curl -u "${SONAR_TOKEN}:" "${SONAR_HOST_URL}/api/issues/gitlab_sast_export?projectKey=ar-be-team_ar-be_cb2ba3ff-93c8-421d-9cdd-a3043f3f1b13&branch=${CI_COMMIT_BRANCH}&pullRequest=${CI_MERGE_REQUEST_IID}" -o gl-sast-sonar-report.json'
  allow_failure: true
  artifacts:
    expire_in: 1 day
    reports:
      sast: gl-sast-sonar-report.json
  rules:
    - if: $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == "187-test-story-for-pipeline-test"
      when: never
    - if: $CI_COMMIT_BRANCH == 'develop'
    - if: $CI_COMMIT_BRANCH == 'main'
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
